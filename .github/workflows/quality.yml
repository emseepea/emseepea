name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: "1"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "5000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
  NPM_CONFIG_FETCH_TIMEOUT: "120000"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.2
          - 24.20.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Test the public boundary
        run: npm test
        env:
          EMSEEPEA_SKIP_PACKED_AUDIT: "true"
          EMSEEPEA_SKIP_PACKED_INITIALIZERS: "true"
      - name: Check the JSON-boundary performance budget
        run: npm run benchmark:built
        env:
          EMSEEPEA_BENCHMARK_PROFILE: github-ubuntu-24.04-standard
      - name: Check proxy progress under concurrent load and paused readers
        run: npm run test:load:streaming
      - name: Check subscription SDK memory with paused readers
        run: node --expose-gc --test tests/load/subscription-sdk.test.mjs
  initializer-qualification:
    name: Standalone initializers / Node.js 24.20.0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify every standalone initializer
        run: npm run test:initializers:packed

  website-performance:
    name: Website publication checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the website and search index
        run: npm run website:build
      - name: Check the built website
        run: npm run test:built -w @emseepea/website
      - name: Enforce the website performance limits
        run: node website/scripts/measure-performance.mjs
      - name: Upload website measurements, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-performance-${{ github.sha }}
          path: website/artifacts/performance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the checked website
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy-website:
    name: Publish website
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [initializer-qualification, test, website-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
