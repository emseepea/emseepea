name: Quality

on:
  pull_request:
    branches-ignore:
      - publish
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: "1"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "5000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
  NPM_CONFIG_FETCH_TIMEOUT: "120000"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Classify the complete change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
      - name: Classify the exact event range
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "docs_only=$(node scripts/docs-only-changes.mjs "$BASE_SHA" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation review
    needs: change-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
      - name: Check documentation in the exact event range
        env:
          DOCS_REVIEW_BASE: ${{ needs.change-scope.outputs.base }}
        run: |
          if git cat-file -e "$DOCS_REVIEW_BASE^{commit}" 2>/dev/null; then
            git diff --check "$DOCS_REVIEW_BASE" "$GITHUB_SHA"
          else
            unset DOCS_REVIEW_BASE
          fi
          node --test tests/docs/published-content-review.test.mjs

  vulnerability-scan:
    name: Known dependency vulnerabilities
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scan the committed lockfile
        id: osv-scan
        run: |
          set +e
          docker run --rm --entrypoint osv-scanner \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --workdir /github/workspace \
            ghcr.io/google/osv-scanner-action@sha256:4cc9d6b5a6bb3a81c38c8d1610f6855512ddd1ba5af77083a856f171dbd0d463 \
            --output=results.json --format=json --lockfile=package-lock.json
          scan_exit=$?
          set -e
          echo "exit-code=$scan_exit" >> "$GITHUB_OUTPUT"
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 1 ]; then exit "$scan_exit"; fi
      - name: Report every known vulnerability
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --new=results.json
            --fail-on-vuln=false
            --gh-annotations=false
      - name: Set up Node.js for fix eligibility
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked gate dependencies
        run: npm ci --ignore-scripts
      - name: Require available fixes published at least 14 days ago
        run: node scripts/vulnerability-release-gate.mjs results.json '${{ steps.osv-scan.outputs.exit-code }}'

  test:
    name: Node.js ${{ matrix.node-version }}
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.2
          - 24.21.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Enable cross-architecture container execution
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up the container builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install the image signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify pinned base images
        run: |
          mapfile -t base_images < <(node scripts/container-base-images.mjs)
          docker buildx imagetools inspect --raw "${base_images[0]}" > node-image.json
          docker buildx imagetools inspect --raw "${base_images[1]}" > runtime-image.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const file of ["node-image.json", "runtime-image.json"]) {
            const image = JSON.parse(await readFile(file, "utf8"));
            const platforms = new Set(image.manifests.map(({ platform }) => `${platform.os}/${platform.architecture}${platform.variant ? `/${platform.variant}` : ""}`));
            if (!platforms.has("linux/amd64") || !platforms.has("linux/arm64/v8")) throw new Error(`${file} is missing a required architecture`);
          }
          NODE
          cosign verify \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com \
            "${base_images[1]}"
      - name: Test the public boundary
        run: npm test
        env:
          EMSEEPEA_SKIP_PACKED_INITIALIZERS: "true"
      - name: Check the JSON-boundary performance budget
        run: npm run benchmark:built
        env:
          EMSEEPEA_BENCHMARK_PROFILE: github-ubuntu-24.04-standard
      - name: Check proxy progress under concurrent load and paused readers
        run: npm run test:load:streaming
      - name: Check request logging under concurrent load and paused readers
        run: npm run test:load:logging
      - name: Check subscription SDK memory with paused readers
        run: node --expose-gc --test tests/load/subscription-sdk.test.mjs
  initializer-qualification:
    name: Standalone initializer / ${{ matrix.example }} / Node.js 24.21.0
    needs: [change-scope, vulnerability-scan]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        example:
          - api-backed-server
          - database-schema-server
          - html-ui-server
          - mongodb-backed-server
          - multi-instance-postgres-server
          - openapi-backed-server
          - progress-streaming-server
          - react-ui-server
          - resources-and-prompts-server
          - soap-backed-server
          - tool-server
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        if: ${{ matrix.example == 'html-ui-server' || matrix.example == 'react-ui-server' }}
        run: npx playwright install --with-deps chromium
      - name: Enable cross-architecture container execution
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up the container builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Regenerate schema-derived code
        if: ${{ matrix.example == 'tool-server' }}
        run: |
          npm run generate:check -w @emseepea/create-database-schema-server
          npm run generate:check -w @emseepea/create-openapi-backed-server
          npm run generate:check -w @emseepea/create-soap-backed-server
      - name: Verify every standalone initializer
        run: npm run test:initializers:packed
        env:
          EMSEEPEA_VERIFY_CONTAINERS: "true"
          EMSEEPEA_CONTAINER_EXAMPLE: ${{ matrix.example }}
      - name: Check the PostgreSQL feedback adapter
        if: ${{ matrix.example == 'tool-server' }}
        run: npm run test:postgres -w @emseepea/feedback
      - name: Enforce integration example performance budgets
        if: ${{ matrix.example == 'tool-server' }}
        run: |
          cd "$GITHUB_WORKSPACE/examples/database-schema-server"
          node test/with-postgres.mjs node --expose-gc "$GITHUB_WORKSPACE/scripts/measure-integration-example.mjs" database
          cd "$GITHUB_WORKSPACE/examples/mongodb-backed-server"
          node test/with-mongodb.mjs node --expose-gc "$GITHUB_WORKSPACE/scripts/measure-integration-example.mjs" mongodb
          cd "$GITHUB_WORKSPACE"
          node --expose-gc scripts/measure-integration-example.mjs openapi
          node --expose-gc scripts/measure-integration-example.mjs soap

  website-performance:
    name: Website publication checks
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the website and search index
        run: npm run website:build
      - name: Check the built website
        run: npm run test:built -w @emseepea/website
      - name: Enforce the website performance limits
        run: node website/scripts/measure-performance.mjs
      - name: Upload website measurements, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-performance-${{ github.sha }}
          path: website/artifacts/performance.json
          if-no-files-found: error
          retention-days: 14
      # ADR-0099: what deploys is the build this job measured, never a rebuild.
      # publish.yml downloads this artifact from this run and deploys it, so the
      # measured bytes and the deployed bytes stay identical across two runs.
      - name: Upload the checked website
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  release-pull-request:
    name: Open or update the release pull request
    # ADR-0101: this job depends on the quality jobs, so a release pull request
    # exists only for a commit whose checks -- including the OSV scan -- passed.
    # That dependency is what binds publication to a passed scan now that the
    # Release workflow is gone. Removing it removes the guarantee.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-scope.outputs.docs_only != 'true' }}
    needs: [change-scope, documentation, initializer-qualification, test, website-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ADR-0099 requires permissions limited to their tasks. These are scoped to
    # this job because the workflow also runs on pull requests, which must not
    # inherit write access.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Detect release work
        id: release-work
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the previous publish head on main
        if: steps.release-work.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin publish >/dev/null 2>&1; then
            git fetch origin publish
            node scripts/release-recovery.mjs
          fi
      - name: Ensure the publish branch exists
        if: steps.release-work.outputs.has_changesets == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin publish >/dev/null 2>&1; then
            git push origin "$GITHUB_SHA:refs/heads/publish"
          fi
      - name: Open or update the release pull request
        id: changesets
        if: steps.release-work.outputs.has_changesets == 'true'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # ADR-0098 step 1: this run opens the pull request and publishes
          # nothing. Publication happens at step 2, from the pull request head.
          publish-script: echo "publication is handled by release.yml"
          version-script: npm run version-packages
          create-github-releases: false
          pr-base-branch: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize a checked replacement candidate
        if: steps.release-work.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-recovery.mjs finalize
      - name: Build and publish the release pull request under next
        # ADR-0098: GitHub starts no run for a branch the automation token
        # wrote, so the build cannot be triggered by the push. The dispatch
        # repeats on every update, so the build always matches the head that
        # will be merged.
        if: steps.release-work.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote origin refs/heads/changeset-release/publish | cut -f1)"
          [ -n "$head_sha" ] || { echo "release pull request branch is missing on origin" >&2; exit 1; }
          for attempt in {1..12}; do
            pr_sha="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base publish --head changeset-release/publish --limit 2 --json headRefOid --jq 'if length == 1 then .[0].headRefOid else empty end')"
            [ "$head_sha" = "$pr_sha" ] && break
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          [ "$head_sha" = "$pr_sha" ] || { echo "release pull request head does not match origin" >&2; exit 1; }
          [ "$head_sha" = "$(git ls-remote origin refs/heads/changeset-release/publish | cut -f1)" ] || { echo "release branch moved before dispatch" >&2; exit 1; }
          gh workflow run release.yml \
            --ref changeset-release/publish \
            -f head_sha="$head_sha" \
            -f base_sha="$GITHUB_SHA" \
            -f quality_run_id="$GITHUB_RUN_ID"
