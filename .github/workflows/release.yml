name: Release pull request or package

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-sha-quality:
    name: Exact commit / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.2
          - 24.20.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Test the public boundary
        run: npm test
      - name: Check the JSON-boundary performance budget
        run: npm run benchmark
        env:
          EMSEEPEA_BENCHMARK_PROFILE: github-ubuntu-24.04-standard
      - name: Check proxy progress under concurrent load and paused readers
        run: npm run test:load:streaming
      - name: Audit dependencies
        run: npm audit --audit-level=high

  semantic-eval:
    name: Check whether examples are understood
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.release-state.outputs.has_changesets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build without model credentials
        run: npm run build
      - name: Detect a release pull request update
        id: release-state
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the pinned Claude CLI
        if: steps.release-state.outputs.has_changesets == 'false'
        run: |
          test "$(node -p 'require("./node_modules/@anthropic-ai/claude-code/package.json").version')" = "2.1.248"
          npm run claude:prepare
          npm run claude:prepare
          test -x node_modules/.bin/claude
          target="$(realpath node_modules/.bin/claude)"
          case "$target" in
            "$GITHUB_WORKSPACE"/node_modules/@anthropic-ai/claude-code/*) ;;
            *) echo "Claude CLI resolved outside the locked package" >&2; exit 1 ;;
          esac
      - name: Check whether a language model understands every example
        if: steps.release-state.outputs.has_changesets == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run test:eval:ci
      - name: Upload redacted language-model evidence
        if: ${{ always() && steps.release-state.outputs.has_changesets == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-eval-${{ github.sha }}
          path: examples/*/artifacts/llm-eval/evidence.json
          if-no-files-found: error
          retention-days: 14

  changesets:
    name: Update release pull request or publish
    needs: [exact-sha-quality, semantic-eval]
    if: ${{ always() && needs.exact-sha-quality.result == 'success' && (needs.semantic-eval.outputs.has_changesets == 'true' || (needs.semantic-eval.outputs.has_changesets == 'false' && needs.semantic-eval.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Detect a publication run
        id: release-state
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build packages for publication
        if: steps.release-state.outputs.has_changesets == 'false'
        run: npm run build
      - name: Capture the current npm package state
        if: steps.release-state.outputs.has_changesets == 'false'
        run: node scripts/verify-registry-release.mjs capture release-artifacts/registry-before.json
      - name: Prepare package evidence
        if: steps.release-state.outputs.has_changesets == 'false'
        env:
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          SEMANTIC_EVAL_ARTIFACT: semantic-eval-${{ github.sha }}
          SEMANTIC_EVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p release-artifacts
          npm pack --workspace @emseepea/server --pack-destination release-artifacts --ignore-scripts --json > release-artifacts/server-pack.json
          npm pack --workspace @emseepea/testing --pack-destination release-artifacts --ignore-scripts --json > release-artifacts/testing-pack.json
          node scripts/verify-packed-package.mjs packages/framework/package.json release-artifacts/server-pack.json
          node scripts/verify-packed-package.mjs packages/testing/package.json release-artifacts/testing-pack.json
          npm sbom --workspace @emseepea/server --omit=dev --package-lock-only --sbom-format cyclonedx --sbom-type framework > release-artifacts/server-sbom.cdx.json
          npm sbom --workspace @emseepea/testing --omit=dev --package-lock-only --sbom-format cyclonedx --sbom-type framework > release-artifacts/testing-sbom.cdx.json
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS
          server_version="$(node -p "require('./packages/framework/package.json').version")"
          testing_version="$(node -p "require('./packages/testing/package.json').version")"
          review_record="docs/reviews/$server_version-release-readiness.md"
          test -s "$review_record"
          grep -Fqx -- '- Result: PASS' "$review_record"
          grep -Fqx -- '- Final result: within appetite.' "$review_record"
          lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          cat > release-artifacts/RELEASE-EVIDENCE.md <<EOF
          # Em See Pea release evidence

          - Commit: $RELEASE_SHA
          - Workflow: $RELEASE_RUN_URL
          - Lockfile SHA-256: $lock_sha
          - Packages: @emseepea/server $server_version; @emseepea/testing $testing_version
          - Node.js: $(node --version)
          - npm: $(npm --version)
          - GitHub CLI: $(gh --version | head -1)
          - Qualification: npm test; npm run benchmark; npm run test:load:streaming; npm audit --audit-level=high; npm pack
          - Semantic qualification: $SEMANTIC_EVAL_RUN_URL, artifact $SEMANTIC_EVAL_ARTIFACT
          - Reviews: ${{ github.server_url }}/${{ github.repository }}/blob/$RELEASE_SHA/$review_record
          - Coverage and limits: ${{ github.server_url }}/${{ github.repository }}/blob/$RELEASE_SHA/docs/protocol-coverage.md
          - Supported slice:
            - Fastify-first MCP 2026-07-28 server
            - JSON operations
            - checked, bounded public POST progress through a trusted proxy
            - public and invocation-scoped OAuth-protected tools
            - checked mapped adapters
            - public static-resource and non-enumerating resource-template discovery and reads
            - public prompt listing and rendering
            - opt-in prompt and resource-template completion
            - opt-in bounded pages for tool, resource, resource-address-pattern, and prompt catalogues with opaque cursors
            - configurable reuse instructions for discovery, catalogues, and resource reads
            - anonymous resource metadata and discovery
            - checked request headers and advertised metadata
            - direct tools, resources, and prompts that request more client input
            - fixed-origin HTTPS JSON GET client with network-address and response checks
            - native HTML form rendering
            - optional request telemetry, dependency readiness, and bounded shutdown flushing
            - code-first AI understanding tests with three answers and nine judgments per case
          - Excluded:
            - template enumeration and protected templates
            - changing catalogues while a server runs
            - object or tenant authorization
            - general or authenticated outbound HTTP policy, retries, or effects
            - deployed streaming tools requiring sign-in
            - transport backpressure and queue overflow
            - resynchronisation, subscriptions, replay, sessions, and framework-managed shared state
            - publication of React and Tailwind packages, or website deployment
            - resource, prompt, template, completion, or streaming performance
            - full-profile conformance
          EOF
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: npm run version-packages
          publish: npm run release
          createGithubReleases: false
      - name: Verify whether both packages were published
        if: steps.release-state.outputs.has_changesets == 'false'
        id: registry-verify
        run: node scripts/verify-registry-release.mjs verify release-artifacts/registry-before.json release-artifacts/registry-after.json
      - name: Verify the downloaded packages
        if: steps.registry-verify.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          server_version="$(node -p "require('./packages/framework/package.json').version")"
          testing_version="$(node -p "require('./packages/testing/package.json').version")"
          mkdir -p registry-artifacts
          npm pack "@emseepea/server@$server_version" --pack-destination registry-artifacts --ignore-scripts --userconfig /dev/null
          npm pack "@emseepea/testing@$testing_version" --pack-destination registry-artifacts --ignore-scripts --userconfig /dev/null
          test "$(sha256sum release-artifacts/*.tgz | cut -d' ' -f1 | sort | tr '\n' ' ')" = "$(sha256sum registry-artifacts/*.tgz | cut -d' ' -f1 | sort | tr '\n' ' ')"
          server_integrity="$(npm view "@emseepea/server@$server_version" dist.integrity --userconfig /dev/null)"
          testing_integrity="$(npm view "@emseepea/testing@$testing_version" dist.integrity --userconfig /dev/null)"
          server_attestations_url="$(npm view "@emseepea/server@$server_version" dist.attestations.url --userconfig /dev/null)"
          testing_attestations_url="$(npm view "@emseepea/testing@$testing_version" dist.attestations.url --userconfig /dev/null)"
          test -n "$server_integrity"
          test -n "$testing_integrity"
          test -n "$server_attestations_url"
          test -n "$testing_attestations_url"
          cat >> release-artifacts/RELEASE-EVIDENCE.md <<EOF

          - @emseepea/server registry integrity: $server_integrity
          - @emseepea/server provenance: $server_attestations_url
          - @emseepea/testing registry integrity: $testing_integrity
          - @emseepea/testing provenance: $testing_attestations_url
          EOF
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --userconfig /dev/null "@emseepea/server@$server_version" "@emseepea/testing@$testing_version"
          npm audit --audit-level=high --userconfig /dev/null
          npm audit signatures --userconfig /dev/null
          node --input-type=module < "$GITHUB_WORKSPACE/scripts/verify-installed-package.mjs"
          cd "$GITHUB_WORKSPACE"
          SERVER_VERSION="$server_version" TESTING_VERSION="$testing_version" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          for (const [key, version, path] of [
            ["server", process.env.SERVER_VERSION, "packages/framework/CHANGELOG.md"],
            ["testing", process.env.TESTING_VERSION, "packages/testing/CHANGELOG.md"],
          ]) {
            const changelog = await readFile(path, "utf8");
            const start = changelog.indexOf(`## ${version}`);
            if (start < 0) throw new Error(`${path} has no ${version} release notes`);
            const next = changelog.indexOf("\n## ", start + 4);
            await writeFile(`release-artifacts/${key}-release-notes.md`, `${changelog.slice(start, next < 0 ? undefined : next).trim()}\n`);
          }
          NODE
          server_tag="@emseepea/server@$server_version"
          testing_tag="@emseepea/testing@$testing_version"
          remote_tag_target() {
            peeled="$(git ls-remote --tags origin "refs/tags/$1^{}" | cut -f1)"
            direct="$(git ls-remote --tags origin "refs/tags/$1" | cut -f1)"
            printf '%s' "${peeled:-$direct}"
          }
          ensure_tag() {
            target="$(remote_tag_target "$1")"
            if [ -z "$target" ]; then
              git tag --annotate "$1" "$GITHUB_SHA" --message "$1"
              git push origin "$1"
            else
              test "$target" = "$GITHUB_SHA"
            fi
            test "$(remote_tag_target "$1")" = "$GITHUB_SHA"
          }
          ensure_release() {
            tag="$1"
            title="$2"
            notes="$3"
            shift 3
            expected_assets="$(printf '%s\n' "$@" | xargs -n1 basename | sort)"
            if gh release view "$tag" >/dev/null 2>&1; then
              test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
              actual_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
              if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false" ] \
                  && [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "true" ] \
                  && [ "$actual_assets" = "$expected_assets" ]; then
                return
              fi
              gh release edit "$tag" --draft --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            else
              gh release create "$tag" --draft --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if ! printf '%s\n' "$expected_assets" | grep -Fqx "$asset"; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done
            gh release upload "$tag" "$@" --clobber
            test "$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)" = "$expected_assets"
            gh release edit "$tag" --draft=false --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false"
            test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "true"
            test "$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)" = "$expected_assets"
          }
          ensure_tag "$server_tag"
          ensure_tag "$testing_tag"
          ensure_release "$server_tag" "$server_tag" release-artifacts/server-release-notes.md \
            release-artifacts/emseepea-server-"$server_version".tgz \
            release-artifacts/server-sbom.cdx.json \
            release-artifacts/RELEASE-EVIDENCE.md \
            release-artifacts/SHA256SUMS
          ensure_release "$testing_tag" "$testing_tag" release-artifacts/testing-release-notes.md \
            release-artifacts/emseepea-testing-"$testing_version".tgz \
            release-artifacts/testing-sbom.cdx.json \
            release-artifacts/RELEASE-EVIDENCE.md \
            release-artifacts/SHA256SUMS
