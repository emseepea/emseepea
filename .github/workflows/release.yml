name: Release build

# ADR-0098 step 2. Builds the npm packages from the release pull request head
# and publishes them under the `next` tag. Everything that verifies a published
# package runs here, against `next`, before anyone merges: a release that fails
# is abandoned without ever reaching `latest`.
#
# Started by explicit dispatch from the Quality run that opened or updated the
# pull request. GitHub starts no run for a branch the automation token wrote,
# and the dispatch is the documented exemption.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: The release pull request head commit
        required: true
      base_sha:
        description: The main commit the head derives from
        required: true
      quality_run_id:
        description: The Quality run that measured this release
        required: true

permissions: {}

env:
  NPM_CONFIG_FETCH_RETRIES: "1"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "5000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
  NPM_CONFIG_FETCH_TIMEOUT: "120000"

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  semantic-eval:
    name: Check whether examples are understood
    # ADR-0057 requires readable semantic evidence bound to the commit the
    # packages are published from. That is this commit, not the trunk commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out the release pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build without model credentials
        run: npm run build
      - name: Prepare the pinned Claude CLI
        run: |
          test "$(node -p 'require("./node_modules/@anthropic-ai/claude-code/package.json").version')" = "2.1.248"
          npm run claude:prepare
          test -x node_modules/.bin/claude
          target="$(realpath node_modules/.bin/claude)"
          case "$target" in
            "$GITHUB_WORKSPACE"/node_modules/@anthropic-ai/claude-code/*) ;;
            *) echo "Claude CLI resolved outside the locked package" >&2; exit 1 ;;
          esac
      - name: Check whether a language model understands every example
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run test:eval:ci
      - name: Upload inspectable language-model evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-eval-${{ inputs.head_sha }}
          path: |
            examples/*/artifacts/llm-eval/evidence.json
            packages/feedback/artifacts/llm-eval/evidence.json
          if-no-files-found: error
          retention-days: 14

  publish-next:
    name: Publish the release under next
    needs: semantic-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check the release pull request against the Changesets plan
        # ADR-0098: this gate is a base-versus-head comparison, and its base is
        # the main commit the head derives from -- not the pull request's base
        # branch, which lags the trunk by a whole release. The plan it compares
        # against is read from the undrained changesets on that base commit.
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/check-release-pull-request.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Build packages for publication
        run: npm run build
      - name: Capture the current npm package state
        run: node scripts/verify-registry-release.mjs capture release-artifacts/registry-before.json
      - name: Prepare package evidence
        env:
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ inputs.head_sha }}
          QUALITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.quality_run_id }}
          SEMANTIC_EVAL_ARTIFACT: semantic-eval-${{ inputs.head_sha }}
          SEMANTIC_EVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p release-artifacts
          node scripts/prepare-release-artifacts.mjs release-artifacts
          node scripts/write-release-evidence.mjs release-artifacts
      - name: Publish the packages under next
        # ADR-0098: this is the only publish. Merging the pull request moves the
        # tag; it does not publish again, which is what keeps the published
        # commit and the built commit the same.
        run: npm run release:next
      - name: Verify the packages reached the registry under next
        id: registry-verify
        env:
          EMSEEPEA_RELEASE_SHA: ${{ inputs.head_sha }}
        run: |
          node scripts/verify-registry-release.mjs verify \
            release-artifacts/registry-before.json release-artifacts/registry-after.json --tag next
      - name: Enable cross-architecture container execution
        if: steps.registry-verify.outputs.ready == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up the container builder
        if: steps.registry-verify.outputs.ready == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify the downloaded packages
        # ADR-0085 requires registry readback to verify the released version,
        # integrity, signatures, provenance and public types. It runs here,
        # against next, so a release that fails never reaches latest.
        if: steps.registry-verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ADR-0098: these checks install by dist-tag. Naming next is what
          # stops them resolving the previous release and passing on it.
          EMSEEPEA_REGISTRY_DIST_TAG: next
        run: |
          mkdir -p registry-artifacts
          package_specs=()
          while IFS=$'\t' read -r name path key version init example; do
            spec="$name@$version"
            package_specs+=("$spec")
            node scripts/pack-registry-package.mjs "$spec" registry-artifacts
            integrity="$(npm view "$spec" dist.integrity --userconfig /dev/null)"
            attestations_url="$(npm view "$spec" dist.attestations.url --userconfig /dev/null)"
            test -n "$integrity"
            test -n "$attestations_url"
            cat >> release-artifacts/RELEASE-EVIDENCE.md <<EOF

          - $name registry integrity: $integrity
          - $name provenance: $attestations_url
          EOF
          done < <(node scripts/public-packages.mjs --publishable --tsv)
          node scripts/use-registry-tarballs.mjs release-artifacts registry-artifacts
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --userconfig /dev/null "${package_specs[@]}"
          npm audit signatures --userconfig /dev/null
          node --input-type=module < "$GITHUB_WORKSPACE/scripts/verify-installed-package.mjs"
          cd "$GITHUB_WORKSPACE"
          EMSEEPEA_GUIDE_PACKAGE_SOURCE=registry node --test tests/docs/getting-started-references.test.mjs
          EMSEEPEA_VERIFY_CONTAINERS=true node scripts/verify-registry-initializers.mjs
          node scripts/write-release-targets.mjs release-artifacts
      - name: Upload the release artifacts for the promotion
        if: steps.registry-verify.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ inputs.head_sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14
