name: Release pull request or package

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-sha-quality:
    name: Exact commit / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.2
          - 24.20.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Test the public boundary
        run: npm test
        env:
          EMSEEPEA_SKIP_PACKED_INITIALIZERS: "true"
      - name: Check the JSON-boundary performance budget
        run: npm run benchmark
        env:
          EMSEEPEA_BENCHMARK_PROFILE: github-ubuntu-24.04-standard
      - name: Check proxy progress under concurrent load and paused readers
        run: npm run test:load:streaming
      - name: Audit dependencies
        run: npm audit --audit-level=high

  initializer-qualification:
    name: Standalone initializers / Node.js 24.20.0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install the browser used by UI checks
        run: npx playwright install --with-deps chromium
      - name: Verify every standalone initializer
        run: npm run test:initializers:packed

  semantic-eval:
    name: Check whether examples are understood
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.release-state.outputs.has_changesets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build without model credentials
        run: npm run build
      - name: Detect a release pull request update
        id: release-state
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the pinned Claude CLI
        if: steps.release-state.outputs.has_changesets == 'false'
        run: |
          test "$(node -p 'require("./node_modules/@anthropic-ai/claude-code/package.json").version')" = "2.1.248"
          npm run claude:prepare
          npm run claude:prepare
          test -x node_modules/.bin/claude
          target="$(realpath node_modules/.bin/claude)"
          case "$target" in
            "$GITHUB_WORKSPACE"/node_modules/@anthropic-ai/claude-code/*) ;;
            *) echo "Claude CLI resolved outside the locked package" >&2; exit 1 ;;
          esac
      - name: Check whether a language model understands every example
        if: steps.release-state.outputs.has_changesets == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run test:eval:ci
      - name: Upload redacted language-model evidence
        if: ${{ always() && steps.release-state.outputs.has_changesets == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-eval-${{ github.sha }}
          path: examples/*/artifacts/llm-eval/evidence.json
          if-no-files-found: error
          retention-days: 14

  changesets:
    name: Update release pull request or publish
    needs: [exact-sha-quality, initializer-qualification, semantic-eval]
    if: ${{ always() && needs.exact-sha-quality.result == 'success' && needs.initializer-qualification.result == 'success' && (needs.semantic-eval.outputs.has_changesets == 'true' || (needs.semantic-eval.outputs.has_changesets == 'false' && needs.semantic-eval.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
      - name: Use the recorded npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.slice(4)')"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Detect a publication run
        id: release-state
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build packages for publication
        if: steps.release-state.outputs.has_changesets == 'false'
        run: npm run build
      - name: Capture the current npm package state
        if: steps.release-state.outputs.has_changesets == 'false'
        run: node scripts/verify-registry-release.mjs capture release-artifacts/registry-before.json
      - name: Prepare package evidence
        if: steps.release-state.outputs.has_changesets == 'false'
        env:
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          SEMANTIC_EVAL_ARTIFACT: semantic-eval-${{ github.sha }}
          SEMANTIC_EVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p release-artifacts
          node scripts/prepare-release-artifacts.mjs release-artifacts
          server_version="$(node -p "require('./packages/framework/package.json').version")"
          package_summary="$(node -e "const p=require('./release-artifacts/packages.json'); process.stdout.write(p.map(x => x.name + ' ' + x.version).join('; '))")"
          review_record="docs/reviews/$server_version-release-readiness.md"
          test -s "$review_record"
          grep -Fqx -- '- Result: PASS' "$review_record"
          grep -Fqx -- '- Final result: within appetite.' "$review_record"
          lock_sha="$(sha256sum package-lock.json | cut -d' ' -f1)"
          cat > release-artifacts/RELEASE-EVIDENCE.md <<EOF
          # Em See Pea release evidence

          - Commit: $RELEASE_SHA
          - Workflow: $RELEASE_RUN_URL
          - Lockfile SHA-256: $lock_sha
          - Packages: $package_summary
          - Node.js: $(node --version)
          - npm: $(npm --version)
          - GitHub CLI: $(gh --version | head -1)
          - Qualification: npm test; npm run benchmark; npm run test:load:streaming; npm audit --audit-level=high; npm pack; standalone initializer checks
          - Semantic qualification: $SEMANTIC_EVAL_RUN_URL, artifact $SEMANTIC_EVAL_ARTIFACT
          - Reviews: ${{ github.server_url }}/${{ github.repository }}/blob/$RELEASE_SHA/$review_record
          - Coverage and limits: ${{ github.server_url }}/${{ github.repository }}/blob/$RELEASE_SHA/docs/protocol-coverage.md
          - Supported slice:
            - Fastify-first MCP 2026-07-28 server
            - JSON operations
            - checked, bounded public POST progress through a trusted proxy
            - public and invocation-scoped OAuth-protected tools
            - checked mapped adapters
            - public static-resource and non-enumerating resource-template discovery and reads
            - public prompt listing and rendering
            - opt-in prompt and resource-template completion
            - opt-in bounded pages for tool, resource, resource-address-pattern, and prompt catalogues with opaque cursors
            - configurable reuse instructions for discovery, catalogues, and resource reads
            - anonymous resource metadata and discovery
            - checked request headers and advertised metadata
            - direct tools, resources, and prompts that request more client input
            - fixed-origin HTTPS JSON GET client with network-address and response checks
            - native HTML form rendering
            - optional request telemetry, dependency readiness, and bounded shutdown flushing
            - code-first AI understanding tests with three answers and nine judgments per case
          - Excluded:
            - template enumeration and protected templates
            - changing catalogues while a server runs
            - object or tenant authorization
            - general or authenticated outbound HTTP policy, retries, or effects
            - deployed streaming tools requiring sign-in
            - transport backpressure and queue overflow
            - resynchronisation, subscriptions, replay, sessions, and framework-managed shared state
            - website deployment
            - resource, prompt, template, completion, or streaming performance
            - full-profile conformance
          EOF
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: npm run version-packages
          publish: npm run release
          createGithubReleases: false
      - name: Verify package publication
        if: steps.release-state.outputs.has_changesets == 'false'
        id: registry-verify
        run: node scripts/verify-registry-release.mjs verify release-artifacts/registry-before.json release-artifacts/registry-after.json
      - name: Verify the downloaded packages
        if: steps.registry-verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p registry-artifacts
          package_specs=()
          while IFS=$'\t' read -r name path key version init example; do
            spec="$name@$version"
            package_specs+=("$spec")
            npm pack "$spec" --pack-destination registry-artifacts --ignore-scripts --userconfig /dev/null
            integrity="$(npm view "$spec" dist.integrity --userconfig /dev/null)"
            attestations_url="$(npm view "$spec" dist.attestations.url --userconfig /dev/null)"
            test -n "$integrity"
            test -n "$attestations_url"
            cat >> release-artifacts/RELEASE-EVIDENCE.md <<EOF

          - $name registry integrity: $integrity
          - $name provenance: $attestations_url
          EOF
          done < <(node scripts/public-packages.mjs --publishable --tsv)
          test "$(sha256sum release-artifacts/*.tgz | cut -d' ' -f1 | sort | tr '\n' ' ')" = "$(sha256sum registry-artifacts/*.tgz | cut -d' ' -f1 | sort | tr '\n' ' ')"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --userconfig /dev/null "${package_specs[@]}"
          npm audit --audit-level=high --userconfig /dev/null
          npm audit signatures --userconfig /dev/null
          node --input-type=module < "$GITHUB_WORKSPACE/scripts/verify-installed-package.mjs"
          cd "$GITHUB_WORKSPACE"
          EMSEEPEA_GUIDE_PACKAGE_SOURCE=registry node --test tests/docs/getting-started-references.test.mjs
          while IFS=$'\t' read -r name path key version init example; do
            test -z "$init" && continue
            parent="$(mktemp -d)"
            (cd "$parent" && npm_config_yes=true npm init "$init@next" -- my-server)
            project="$parent/my-server"
            npm install --prefix "$project" --ignore-scripts --userconfig /dev/null
            npm run --prefix "$project" lint
            if [[ "$example" == *-ui ]]; then
              (cd "$project" && npx playwright install --with-deps chromium)
            fi
            npm test --prefix "$project"
            (cd "$project" && npx --no-install emseepea-test --smoke \
              --model-command "$GITHUB_WORKSPACE/tests/fixtures/fake-semantic-model.mjs" \
              --output artifacts/smoke.json eval)
            rm -rf "$parent"
          done < <(node scripts/public-packages.mjs --publishable --tsv)
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const packages = JSON.parse(await readFile("release-artifacts/packages.json", "utf8"));
          const registry = JSON.parse(await readFile("release-artifacts/registry-after.json", "utf8"));
          const targets = [];
          for (const item of packages) {
            const releaseSha = registry.packages.find(({ name }) => name === item.name)?.releaseSha;
            if (!releaseSha) throw new Error(`${item.name} release commit is missing`);
            targets.push([
              item.name, item.version, item.key, item.filename, item.sbomFile, item.notesFile, releaseSha,
            ].join("\t"));
          }
          await writeFile("release-artifacts/release-targets.tsv", `${targets.join("\n")}\n`);
          NODE
          remote_tag_target() {
            peeled="$(git ls-remote --tags origin "refs/tags/$1^{}" | cut -f1)"
            direct="$(git ls-remote --tags origin "refs/tags/$1" | cut -f1)"
            printf '%s' "${peeled:-$direct}"
          }
          ensure_tag() {
            target="$(remote_tag_target "$1")"
            if [ -z "$target" ]; then
              git tag --annotate "$1" "$2" --message "$1"
              git push origin "$1"
            else
              test "$target" = "$2"
            fi
            test "$(remote_tag_target "$1")" = "$2"
          }
          ensure_release() {
            tag="$1"
            title="$2"
            notes="$3"
            shift 3
            expected_assets="$(printf '%s\n' "$@" | xargs -n1 basename | sort)"
            if gh release view "$tag" >/dev/null 2>&1; then
              test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
              actual_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
              if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false" ] \
                  && [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "true" ] \
                  && [ "$actual_assets" = "$expected_assets" ]; then
                return
              fi
              gh release edit "$tag" --draft --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            else
              gh release create "$tag" --draft --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if ! printf '%s\n' "$expected_assets" | grep -Fqx "$asset"; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done
            gh release upload "$tag" "$@" --clobber
            test "$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)" = "$expected_assets"
            gh release edit "$tag" --draft=false --verify-tag --prerelease --latest=false --title "$title" --notes-file "$notes"
            test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false"
            test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "true"
            test "$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)" = "$expected_assets"
          }
          while IFS=$'\t' read -r name version key filename sbom_file notes_file release_sha; do
            tag="$name@$version"
            ensure_tag "$tag" "$release_sha"
            ensure_release "$tag" "$tag" "release-artifacts/$notes_file" \
              "release-artifacts/$filename" \
              "release-artifacts/$sbom_file" \
              release-artifacts/RELEASE-EVIDENCE.md \
              release-artifacts/SHA256SUMS
          done < release-artifacts/release-targets.tsv
