description: Em See Pea example semantic qualification

providers:
  - id: file://./provider.mjs
    config:
      maxRetries: 0
      role: agent

prompts:
  - "{{question}}"

defaultTest:
  options:
    timeoutMs: 120000
    provider:
      id: file://./provider.mjs
      config:
        maxRetries: 0
        role: judge
    rubricPrompt: |
      Judge the meaning of this answer against every criterion below. A pass
      requires every criterion. Ignore harmless wording differences.

      Example under test: {{example}}

      Criteria:
      {{rubric}}

      Answer:
      <answer>
      {{output}}
      </answer>

      Return only JSON with this exact shape:
      {"pass": true or false, "score": 1 or 0, "reason": "one concise sentence"}
  assert:
    - type: javascript
      value: |
        const actual = context.metadata?.pathEvidence ?? [];
        const required = String(context.vars.requiredPaths).split("|");
        const seen = new Set(actual.map(({ method, target }) => `${method}:${target}`));
        const missing = required.filter((path) => !seen.has(path));
        return missing.length === 0
          ? { pass: true, score: 1, reason: "required MCP path evidence recorded" }
          : { pass: false, score: 0, reason: `missing MCP path evidence: ${missing.join(", ")}` };
    - type: javascript
      value: |
        const answer = String(output).toLowerCase();
        const missing = String(context.vars.criticalFacts)
          .split("|")
          .filter((fact) => !answer.includes(fact.toLowerCase()));
        return missing.length === 0
          ? { pass: true, score: 1, reason: "deterministic critical facts present" }
          : { pass: false, score: 0, reason: `missing critical facts: ${missing.join(", ")}` };

tests:
  - description: Basic no-UI bean details are interpreted correctly
    vars:
      example: basic-no-ui
      question: >-
        For Highland Bloom, give me its origin, variety, processing method,
        roast, and tasting notes. Keep those concepts distinct.
      requiredPaths: tools/call:get-bean-details
      criticalFacts: Sample Highlands|Bourbon|natural|medium|berry|cocoa
    assert:
      - type: llm-rubric
        value: >-
          The answer says Highland Bloom is a medium-roast, naturally processed
          Bourbon from Sample Highlands with berry and cocoa tasting notes.
          It does not confuse origin, variety, process, roast, or tasting notes.

  - description: Backend no-UI coffee ratings are interpreted correctly
    vars:
      example: backend-no-ui
      question: >-
        Search the coffee catalogue for natural coffees. Name each returned
        coffee, its roaster and origin, say whether more matches are available,
        and explain exactly what the acidity and body scores mean. Which coffee
        is more acidic, and which has the fuller body?
      requiredPaths: tools/call:search-coffee-catalog
      criticalFacts: Riverlight Natural|North Star Sample Roasters|Burundi|Cedar Grove|Harbour Sample Coffee|Colombia|more matches|low acidity|high acidity|light body|full body
    assert:
      - type: llm-rubric
        value: >-
          The answer reports Riverlight Natural by North Star Sample Roasters
          from Burundi and Cedar Grove by Harbour Sample Coffee from Colombia.
          It says more matches are available. It explains that acidity runs
          from 1 for low acidity to 5 for high acidity, while body runs from 1
          for light body to 5 for full body. It therefore identifies Riverlight
          Natural, scored 5 versus 2, as more acidic and Cedar Grove, scored 4
          versus 2, as having the fuller body. It does not treat either score as
          a quality rating or reverse either scale.

  - description: Multi-instance report replay is not mistaken for a second report
    vars:
      example: multi-instance
      question: >-
        Summarize daily-roast-report. Which server instance originally created
        it, what are the roast counts, and what happens if another server
        instance uses the same request ID?
      requiredPaths: tools/call:create-shared-bean-report
      criticalFacts: eval-instance|total beans|4|1 light|2 medium|1 dark|same stored report|does not create
    assert:
      - type: llm-rubric
        value: >-
          The answer says eval-instance originally created daily-roast-report,
          which covers four beans: one light, two medium, and one dark. It says
          another server using the same request ID receives that original
          stored report and does not create a second report.

  - description: Native UI preview is not mistaken for a completed effect
    vars:
      example: native-ui
      question: >-
        Summarize the dark-roast preview. Was a report sent or stored, and did
        this operation change anything?
      requiredPaths: tools/call:preview-bean-report
      criticalFacts: Forest Ember|Sample Range|preview-only|false|No report was sent or stored
    assert:
      - type: llm-rubric
        value: >-
          The answer identifies Forest Ember from Sample Range as the one
          dark-roast match. It says the result is preview-only,
          effectPerformed is false, no report was sent or stored, and no
          external action or data change occurred.

  - description: Protected inventory availability is interpreted correctly
    vars:
      example: protected-no-ui
      question: >-
        How many green coffee bags can we promise to customers now? Show the
        calculation and explain whether the inbound bags count yet.
      requiredPaths: tools/call:get-private-inventory-report
      criticalFacts: 120|35|85|40
    assert:
      - type: llm-rubric
        value: >-
          The answer calculates 85 bags available to promise as 120 on hand
          minus 35 reserved. It says the 40 inbound bags are not yet available
          to promise and does not add them to the current 85.

  - description: React UI preview is not mistaken for a completed effect
    vars:
      example: react-tailwind-ui
      question: >-
        Summarize the dark-roast preview. Was a report sent or stored, and did
        this operation change anything?
      requiredPaths: tools/call:preview-bean-report
      criticalFacts: Forest Ember|Sample Range|preview-only|false|No report was sent or stored
    assert:
      - type: llm-rubric
        value: >-
          The answer identifies Forest Ember from Sample Range as the one
          dark-roast match. It says the result is preview-only,
          effectPerformed is false, no report was sent or stored, and no
          external action or data change occurred.

  - description: Resource and prompt distinguish strength from extraction
    vars:
      example: resources-prompts
      question: >-
        Does making coffee stronger necessarily mean that extraction is higher?
        Explain the distinction for a home brewer.
      requiredPaths: resources/read:guide://coffee/getting-started|prompts/get:brew-guide
      criticalFacts: concentration|extraction
    assert:
      - type: llm-rubric
        value: >-
          The answer says stronger coffee does not necessarily mean higher
          extraction. It explains that strength is concentration while
          extraction is how much material left the grounds, and it does not
          describe the concepts as interchangeable.

  - description: Streaming roast progress is distinct from the final result
    vars:
      example: streaming-progress
      question: >-
        Run sample-batch. Name the batch, list the progress stages, and report
        the final status and final roasted mass. Keep progress and the completed
        result distinct.
      requiredPaths: tools/call:roast-sample-batch
      criticalFacts: sample-batch|charge|first crack|cool|complete|820
    assert:
      - type: llm-rubric
        value: >-
          The answer identifies charge, first crack, and cool as progress
          stages, then separately reports the completed final result of 820
          roasted grams for sample-batch. It does not treat an intermediate
          progress stage as the final result.
