swagger: "2.0"
info:
  title: Petstore fixture
  version: "1.0.0"
basePath: /v2
schemes: [https]
paths:
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          type: integer
          format: int64
          minimum: 1
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/Pet"
definitions:
  Pet:
    type: object
    required: [id, name, photoUrls]
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      photoUrls:
        type: array
        items: { type: string }
      status:
        type: string
        enum: [available, pending, sold]
